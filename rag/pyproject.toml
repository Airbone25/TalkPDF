[project]
name = "rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Airbone25", email = "keshavmehra2005@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.162.2",
    "langchain>=1.4.9",
    "langchain-community>=0.4.2",
    "langchain-groq>=1.1.3",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "pypdf>=7.0.0",
    "python-dotenv>=1.2.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
rag = "rag:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
